name: ci-watch
description: Monitor CI runs, auto-fix failures
trigger:
  cron: "*/5 * * * *"
steps:
  - name: check-ci
    run: "gh run list --limit 5 --json status,conclusion,headBranch,name,databaseId"
    timeout: 30
    on_failure: continue

  - name: get-failures
    when: "contains(steps.check-ci.output, 'failure')"
    run: "gh run list --limit 5 --json status,conclusion,headBranch,name,databaseId | python3 -c \"import sys,json; runs=json.load(sys.stdin); [print(f'Run {r[\\\"databaseId\\\"]} on {r[\\\"headBranch\\\"]}: {r[\\\"conclusion\\\"]}') for r in runs if r.get('conclusion')=='failure']\""
    timeout: 30
    on_failure: continue

  - name: fix
    when: "steps.get-failures.exit_code == 0"
    agent: "CI failures detected. Check out the failing branch, look at the CI logs with 'gh run view <id> --log-failed', and fix the issues."
